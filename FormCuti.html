  <script>
  // ============================================================
  // GLOBAL STATE — Holiday Data Management
  // ============================================================
  window.liburNasionalDates = [];
  window.liburDataReady = false;
  window._pendingHitungCuti = false;

  /**
   * Load data libur dari backend Apps Script.
   * Setelah selesai, auto re-calculate jika user sudah input tanggal.
   */
  function initHolidayData() {
    console.log('[HRIS] ⏳ Memulai load data Libur Nasional...');

    google.script.run
      .withSuccessHandler(function (dates) {
        window.liburNasionalDates = dates || [];
        window.liburDataReady = true;
        console.log('[HRIS] ✅ Libur Nasional loaded:', window.liburNasionalDates.length, 'tanggal');
        console.log('[HRIS] Daftar libur:', window.liburNasionalDates);

        // Auto re-calculate jika user sudah input tanggal sebelum data siap
        if (window._pendingHitungCuti) {
          console.log('[HRIS] 🔄 Re-calculating karena data libur baru selesai dimuat...');
          window._pendingHitungCuti = false;
          hitungLamaCuti();
        }
      })
      .withFailureHandler(function (err) {
        // Tetap tandai ready agar tidak memblokir perhitungan selamanya
        window.liburDataReady = true;
        console.warn('[HRIS] ⚠️ Gagal memuat Libur Nasional:', err.message || err);

        if (window._pendingHitungCuti) {
          window._pendingHitungCuti = false;
          hitungLamaCuti();
        }
      })
      .getLiburNasionalDates();
  }

  // Panggil saat halaman dimuat
  initHolidayData();

  // ============================================================
  // TOGGLE KETERANGAN
  // ============================================================
  function toggleKeterangan() {
    const jenis = document.getElementById('jenisCutiSelect').value;
    const container = document.getElementById('keteranganContainer');
    const input = document.getElementById('keteranganInput');
    if (jenis === 'Lain-lain') {
      container.style.display = 'block';
      input.required = true;
    } else {
      container.style.display = 'none';
      input.required = false;
      input.value = '';
    }
  }

  // ============================================================
  // HITUNG LAMA CUTI — Fixed: race condition + timezone + debug
  // ============================================================
  function hitungLamaCuti() {
    const tglMulai = document.getElementById('tglMulai').value;
    const tglSelesai = document.getElementById('tglSelesai').value;
    const inputLama = document.getElementById('lamaCuti');

    if (!tglMulai || !tglSelesai) return;

    // GUARD: Jika data libur belum siap, antrikan re-calculation
    if (!window.liburDataReady) {
      console.log('[HRIS] ⏳ Data libur belum siap, perhitungan ditunda hingga data loaded...');
      window._pendingHitungCuti = true;
      inputLama.value = '';
      inputLama.placeholder = 'Memuat data libur...';
      return;
    }

    // FIX TIMEZONE: Tambah T00:00:00 agar diparsing sebagai local time, bukan UTC
    const date1 = new Date(tglMulai + 'T00:00:00');
    const date2 = new Date(tglSelesai + 'T00:00:00');

    console.log('[HRIS] 📅 Menghitung cuti:', tglMulai, '→', tglSelesai);
    console.log('[HRIS] 📋 Jumlah libur nasional:', window.liburNasionalDates.length, 'tanggal');

    const diffTime = date2 - date1;
    const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

    if (totalDays <= 0) {
      inputLama.value = '';
      inputLama.placeholder = 'Otomatis';
      alert('Maaf, Tanggal Selesai tidak boleh mendahului Tanggal Mulai!');
      document.getElementById('tglSelesai').value = '';
      return;
    }

    let durasi = 0;
    const skippedDays = []; // Untuk debug logging

    for (let i = 0; i < totalDays; i++) {
      const currDate = new Date(date1);
      currDate.setDate(currDate.getDate() + i);

      const day = currDate.getDay(); // 0=Minggu, 6=Sabtu
      const yyyy = currDate.getFullYear();
      const mm = String(currDate.getMonth() + 1).padStart(2, '0');
      const dd = String(currDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;

      const isWeekend = day === 0 || day === 6;
      const isHoliday = window.liburNasionalDates.includes(dateStr);

      if (isWeekend || isHoliday) {
        skippedDays.push(`${dateStr} [${isHoliday ? '🏖️ Libur Nasional' : '📅 Weekend'}]`);
      } else {
        durasi++;
      }
    }

    // Debug output — bisa dihapus setelah production verified
    console.log('[HRIS] ⛔ Hari dilewati:', skippedDays.length ? skippedDays : 'tidak ada');
    console.log('[HRIS] ✅ Durasi kerja final:', durasi, 'hari');

    inputLama.value = durasi;
    inputLama.placeholder = 'Otomatis';
  }

  // ============================================================
  // FORM SUBMIT
  // ============================================================
  function handleFormSubmit(event) {
    event.preventDefault();

    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('loadingSpinner').style.display = 'inline-block';
    document.getElementById('btnText').innerText = 'Mengirim Data...';
    document.getElementById('pesan').style.display = 'none';

    const form = document.getElementById('cutiForm');
    const formData = new FormData(form);
    const dataObj = {};
    formData.forEach((value, key) => { dataObj[key] = value; });

    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure)
      .simpanDataCuti(dataObj);
  }

  function onSuccess(response) {
    const pesanEl = document.getElementById('pesan');
    pesanEl.style.display = 'block';

    if (response.status === 'success') {
      pesanEl.className = 'alert alert-success';
      pesanEl.innerHTML = '<strong>Berhasil!</strong> ' + response.message;
      document.getElementById('cutiForm').reset();
    } else {
      pesanEl.className = 'alert alert-danger';
      pesanEl.innerHTML = '<strong>Gagal!</strong> ' + response.message;
    }

    kembalikanTombol();
  }

  function onFailure(error) {
    const pesanEl = document.getElementById('pesan');
    pesanEl.style.display = 'block';
    pesanEl.className = 'alert alert-danger';
    pesanEl.innerHTML = '<strong>Terjadi Kesalahan Sistem:</strong> ' + error.message;

    kembalikanTombol();
  }

  function kembalikanTombol() {
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('loadingSpinner').style.display = 'none';
    document.getElementById('btnText').innerText = 'Kirim Pengajuan Cuti';

    setTimeout(() => {
      document.getElementById('pesan').style.display = 'none';
    }, 5000);
  }
  </script>
