  <script>
  // ============================================================
  // GLOBAL STATE — Holiday Data Management
  // ============================================================
  window.liburNasionalDates = [];
  window.liburDataReady = false;
  window._pendingHitungCuti = false;

  /**
   * Load data libur dari backend Apps Script.
   * Setelah selesai, auto re-calculate jika user sudah input tanggal.
   */
  function initHolidayData() {
    console.log('[HRIS] ⏳ Memulai load data Libur Nasional...');

    google.script.run
      .withSuccessHandler(function (dates) {
        window.liburNasionalDates = dates || [];
        window.liburDataReady = true;
        console.log('[HRIS] ✅ Libur Nasional loaded:', window.liburNasionalDates.length, 'tanggal');
        console.log('[HRIS] Daftar libur:', window.liburNasionalDates);

        // Auto re-calculate jika user sudah input tanggal sebelum data siap
        if (window._pendingHitungCuti) {
          console.log('[HRIS] 🔄 Re-calculating karena data libur baru selesai dimuat...');
          window._pendingHitungCuti = false;
          hitungLamaCuti();
        }
      })
      .withFailureHandler(function (err) {
        // Tetap tandai ready agar tidak memblokir perhitungan selamanya
        window.liburDataReady = true;
        console.warn('[HRIS] ⚠️ Gagal memuat Libur Nasional:', err.message || err);

        if (window._pendingHitungCuti) {
          window._pendingHitungCuti = false;
          hitungLamaCuti();
        }
      })
      .getLiburNasionalDates();
  }

  // Panggil saat halaman dimuat
  initHolidayData();

  // ============================================================
  // TOGGLE KETERANGAN
  // ============================================================
  function toggleKeterangan() {
    const jenis = document.getElementById('jenisCutiSelect').value;
    const container = document.getElementById('keteranganContainer');
    const input = document.getElementById('keteranganInput');
    if (jenis === 'Lain-lain') {
      container.style.display = 'block';
      input.required = true;
    } else {
      container.style.display = 'none';
      input.required = false;
      input.value = '';
    }
  }

  // ============================================================
  // HITUNG LAMA CUTI — Fixed: race condition + timezone + debug
  // ============================================================
  function hitungLamaCuti() {
    const tglMulai = document.getElementById('tglMulai').value;
    const tglSelesai = document.getElementById('tglSelesai').value;
    const inputLama = document.getElementById('lamaCuti');

    if (!tglMulai || !tglSelesai) return;

    // GUARD: Jika data libur belum siap, antrikan re-calculation
    if (!window.liburDataReady) {
      console.log('[HRIS] ⏳ Data libur belum siap, perhitungan ditunda hingga data loaded...');
      window._pendingHitungCuti = true;
      inputLama.value = '';
      inputLama.placeholder = 'Memuat data libur...';
      return;
    }

    // FIX TIMEZONE: Tambah T00:00:00 agar diparsing sebagai local time, bukan UTC
    const date1 = new Date(tglMulai + 'T00:00:00');
    const date2 = new Date(tglSelesai + 'T00:00:00');

    console.log('[HRIS] 📅 Menghitung cuti:', tglMulai, '→', tglSelesai);
    console.log('[HRIS] 📋 Jumlah libur nasional:', window.liburNasionalDates.length, 'tanggal');

    const diffTime = date2 - date1;
    const totalDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;

    if (totalDays <= 0) {
      inputLama.value = '';
      inputLama.placeholder = 'Otomatis';
      alert('Maaf, Tanggal Selesai tidak boleh mendahului Tanggal Mulai!');
      document.getElementById('tglSelesai').value = '';
      return;
    }

    let durasi = 0;
    const skippedDays = []; // Untuk debug logging

    for (let i = 0; i < totalDays; i++) {
      const currDate = new Date(date1);
      currDate.setDate(currDate.getDate() + i);

      const day = currDate.getDay(); // 0=Minggu, 6=Sabtu
      const yyyy = currDate.getFullYear();
      const mm = String(currDate.getMonth() + 1).padStart(2, '0');
      const dd = String(currDate.getDate()).padStart(2, '0');
      const dateStr = `${yyyy}-${mm}-${dd}`;

      const isWeekend = day === 0 || day === 6;
      const isHoliday = window.liburNasionalDates.includes(dateStr);

      if (isWeekend || isHoliday) {
        skippedDays.push(`${dateStr} [${isHoliday ? '🏖️ Libur Nasional' : '📅 Weekend'}]`);
      } else {
        durasi++;
      }
    }

    // Debug output — bisa dihapus setelah production verified
    console.log('[HRIS] ⛔ Hari dilewati:', skippedDays.length ? skippedDays : 'tidak ada');
    console.log('[HRIS] ✅ Durasi kerja final:', durasi, 'hari');

    inputLama.value = durasi;
    inputLama.placeholder = 'Otomatis';
  }

  // ============================================================
  // FORM SUBMIT
  // ============================================================
  function handleFormSubmit(event) {
    event.preventDefault();

    document.getElementById('btnSubmit').disabled = true;
    document.getElementById('loadingSpinner').style.display = 'inline-block';
    document.getElementById('btnText').innerText = 'Mengirim Data...';
    document.getElementById('pesan').style.display = 'none';

    const form = document.getElementById('cutiForm');
    const formData = new FormData(form);
    const dataObj = {};
    formData.forEach((value, key) => { dataObj[key] = value; });

    // Sertakan email pengirim agar backend bisa lookup nomor HP atasan
    try {
      const userHRIS = JSON.parse(localStorage.getItem('userHRIS') || '{}');
      dataObj.emailPengirim = userHRIS.email || '';
    } catch (e) { dataObj.emailPengirim = ''; }

    google.script.run
      .withSuccessHandler(onSuccess)
      .withFailureHandler(onFailure)
      .simpanDataCuti(dataObj);
  }

  function onSuccess(response) {

    pesanEl.style.display = 'block';

    if (response.status === 'success') {
      // Buat tombol WA jika info atasan tersedia
      let waBtnHtml = '';
      if (response.atasanInfo && response.atasanInfo.waNumber) {
        const ai = response.atasanInfo;
        const namaAtasan = ai.namaAtasan || 'Atasan';
        // Ambil data form SEBELUM reset (nilai masih ada di DOM)
        const nama = document.querySelector('[name="nama"]').value || '';
        const tglMulai = document.querySelector('[name="tanggal_mulai"]').value || '';
        const tglSelesai = document.querySelector('[name="tanggal_selesai"]').value || '';
        const lamaCuti = document.querySelector('[name="lama_cuti"]').value || '';
        const periode = tglMulai && tglSelesai ? `${tglMulai} s/d ${tglSelesai}` : tglMulai;

        // Simpan data untuk dipakai setelah getScriptUrl
        const waData = { ai, namaAtasan, nama, periode, lamaCuti };

        // Ambil URL portal secara dinamis

          .withSuccessHandler(function(portalUrl) {
            const hrisUrl = portalUrl || '';
            const pesanWa = encodeURIComponent(`Halo Bapak/Ibu ${waData.namaAtasan}, saya ${waData.nama} baru saja mengajukan cuti melalui Portal HRIS untuk tanggal ${waData.periode} (${waData.lamaCuti} hari). Mohon kesediaannya untuk meninjau dan memberikan persetujuan melalui tautan berikut: ${hrisUrl}\nTerima kasih.`);

              waContainer.innerHTML = `

                   class="btn btn-success btn-sm fw-bold d-inline-flex align-items-center gap-2">

                  </svg>
                  Hubungi Bapak/Ibu ${waData.namaAtasan} via WhatsApp
                </a>
                <small class="text-muted d-block mt-1">Kirim notifikasi follow-up ke atasan Anda</small>`;
            }
          })
          .withFailureHandler(function() {
            // Fallback tanpa URL portal
            const pesanWa = encodeURIComponent(`Halo Bapak/Ibu ${waData.namaAtasan}, saya ${waData.nama} baru saja mengajukan cuti melalui Portal HRIS untuk tanggal ${waData.periode} (${waData.lamaCuti} hari). Mohon kesediaannya untuk meninjau pengajuan saya. Terima kasih.`);
            const waContainer = document.getElementById('wa-btn-container');
            if (waContainer) {
              waContainer.innerHTML = `
                <a href="https://wa.me/${waData.ai.waNumber}?text=${pesanWa}" target="_blank"
                   class="btn btn-success btn-sm fw-bold d-inline-flex align-items-center gap-2">
                  <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
                    <path d="M13.601 2.326A7.854 7.854 0 0 0 7.994 0C3.627 0 .068 3.558.064 7.926c0 1.399.366 2.76 1.057 3.965L0 16l4.204-1.102a7.933 7.933 0 0 0 3.79.965h.004c4.368 0 7.926-3.558 7.93-7.93A7.898 7.898 0 0 0 13.6 2.326zM7.994 14.521a6.573 6.573 0 0 1-3.356-.92l-.24-.144-2.494.654.666-2.433-.156-.251a6.56 6.56 0 0 1-1.007-3.505c0-3.626 2.957-6.584 6.591-6.584a6.56 6.56 0 0 1 4.66 1.931 6.557 6.557 0 0 1 1.928 4.66c-.004 3.639-2.961 6.592-6.592 6.592zm3.615-4.934c-.197-.099-1.17-.578-1.353-.646-.182-.065-.315-.099-.445.099-.133.197-.513.646-.627.775-.114.133-.232.148-.43.05-.197-.1-.836-.308-1.592-.985-.59-.525-.985-1.175-1.103-1.372-.114-.198-.011-.304.088-.403.087-.088.197-.232.296-.346.1-.114.133-.198.198-.33.065-.134.034-.248-.015-.347-.05-.099-.445-1.076-.612-1.47-.16-.389-.323-.335-.445-.34-.114-.007-.247-.007-.38-.007a.729.729 0 0 0-.529.247c-.182.198-.691.677-.691 1.654 0 .977.71 1.916.81 2.049.098.133 1.394 2.132 3.383 2.992.47.205.84.326 1.129.418.475.152.904.129 1.246.08.38-.058 1.171-.48 1.338-.943.164-.464.164-.86.114-.943-.049-.084-.182-.133-.38-.232z"/>
                  </svg>
                  Hubungi Bapak/Ibu ${waData.namaAtasan} via WhatsApp
                </a>
                <small class="text-muted d-block mt-1">Kirim notifikasi follow-up ke atasan Anda</small>`;
            }
          })
          .getScriptUrl();

        waBtnHtml = `<div id="wa-btn-container" class="mt-3 pt-3 border-top border-success-subtle"><small class="text-muted">Memuat tombol WhatsApp...</small></div>`;
      }

      pesanEl.className = 'alert alert-success';
      pesanEl.innerHTML = '<strong>Berhasil!</strong> ' + response.message + waBtnHtml;
      document.getElementById('cutiForm').reset();
    } else {
      pesanEl.className = 'alert alert-danger';
      pesanEl.innerHTML = '<strong>Gagal!</strong> ' + response.message;
    }

    kembalikanTombol();
  }

  function onFailure(error) {
    const pesanEl = document.getElementById('pesan');
    pesanEl.style.display = 'block';
    pesanEl.className = 'alert alert-danger';
    pesanEl.innerHTML = '<strong>Terjadi Kesalahan Sistem:</strong> ' + error.message;

    kembalikanTombol();
  }

  function kembalikanTombol() {
    document.getElementById('btnSubmit').disabled = false;
    document.getElementById('loadingSpinner').style.display = 'none';
    document.getElementById('btnText').innerText = 'Kirim Pengajuan Cuti';
  }
  </script>
